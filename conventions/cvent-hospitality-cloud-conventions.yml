note: >-
  Cross-cutting runtime semantics for the Cvent REST API — the contract that carries the Hospitality
  Cloud surface (Housing / Passkey RegLink, RFPs, Venues, Travel). Every statement below is either
  quoted from a Cvent docs page or read out of the harvested contract.
authentication:
  style: OAuth 2.0 bearer
  header: 'Authorization: Bearer {accessToken}'
  flows:
    - client_credentials
    - authorization_code
  token_endpoint: https://api-platform.cvent.com/ea/oauth2/token
  authorization_endpoint: https://api-platform.cvent.com/ea/oauth2/authorize
  token_lifetime: 60 minutes
  scope_count: 238
  scope_shape: '<domain>/<resource>:<read|write|delete>, e.g. housing/reservations:write'
  gotcha: >-
    A token carrying roughly 50 or more scopes trips HTTP 431 (Request headers too large). Cvent's own
    guidance is to mint a runtime token with only the scopes a call needs.
  artifacts:
    - authentication/cvent-hospitality-cloud-authentication.yml
    - scopes/cvent-hospitality-cloud-scopes.yml
  docs: https://developers.cvent.com/docs/rest-api/explanation/concepts
pagination:
  style: opaque cursor
  request_params:
    - name: limit
      in: query
      note: Page size.
    - name: token
      in: query
      note: The currentToken value from the previous response.
  response_envelope: paging
  response_fields:
    - paging.limit
    - paging.totalCount
    - paging.currentToken
  termination: >-
    Continue until the response contains no currentToken, which indicates the last page.
  docs: https://developers.cvent.com/docs/rest-api/reference/reference
filtering:
  style: POST /filter companion endpoints plus a match-filter grammar
  note: >-
    Many list surfaces have a POST sibling (for example POST /attendees/filter,
    POST /logs/communications/messages/filter) that takes a structured filter body rather than query
    parameters.
  docs:
