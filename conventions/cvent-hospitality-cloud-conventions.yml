      rest: https://api-platform.cvent.com/ea
      soap: https://api.cvent.com/soap/V200611.ASMX
    - name: European Union
      rest: https://api-platform-eur.cvent.com/ea
      soap: https://api-eur.cvent.com/SOAP/V200611.ASMX
idempotency:
  coverage: none
  mechanism: null
  header: null
  scope: []
  evidence: >-
    No Idempotency-Key header, no idempotency parameter, and no idempotency extension appears anywhere
    in the 469-operation contract (searched openapi/_original/cvent-hospitality-cloud-rest-apis-openapi.json
    for /idempoten/i — zero matches). The Concepts page says clients should "follow idempotency
    guidelines for mutating endpoints when supported (for example use idempotency keys where available)"
    but names no header, no retention window and no covered operation, and no other Cvent page defines
    one.
  consequence: >-
    A retried POST /reservation-requests or POST /reservations can create a duplicate. Callers must
    dedupe themselves — the RegLink flow's own sourceId (an attendee-specific identifier the caller
    assigns and Passkey echoes back on callbacks) is the closest available correlation key, but it is a
    caller-side convention, not a server-enforced idempotency contract.
  docs: https://developers.cvent.com/docs/rest-api/explanation/concepts
dry_run_mode:
  supported: false
  evidence: >-
    No dry-run, preview, validate-only or simulate parameter appears on any mutating operation in the
    contract.
reversibility:
  grade: documented
  grade_basis: >-
    Reversal paths exist and are documented operation-by-operation with their preconditions, but no Cvent
    page or contract field states a TIME WINDOW inside which a reversal is accepted. Under the 0.12.0
    rule that is `documented` (0.4), not `verified` (1.0). No window is asserted here because none is
    published, and an invented window on a hotel booking is the error that costs a customer money.
  write_surfaces:
    - operation: createReservationRequest
      method: POST
      path: /reservation-requests
      reversal: cancelReservationRequest
      reversal_operation: DELETE /reservation-requests/{reservationRequestsId}
      window: null
      precondition: >-
        "You cannot cancel a reservation request that already has a linked reservation." Unlink the
        reservation first.
      caveat: >-
        "If a reservation has already been booked through this request, cancelling the request does not
        cancel the linked reservation." Cancelling the request and cancelling the booking are two
        separate actions.
      source: openapi/cvent-hospitality-cloud-housing-openapi.yml
    - operation: createReservation
      method: POST
      path: /reservations
      reversal: cancelReservation
      reversal_operation: DELETE /reservations/{reservationId}
      window: null
      caveat: >-
        "Cancelling a reservation does not cancel the linked reservation request." After cancellation,
        unlink the reservation from its request so a new one can be linked.
      source: openapi/cvent-hospitality-cloud-housing-openapi.yml
    - operation: linkReservation
      method: POST
      path: /reservation-requests/{reservationRequestsId}/reservations/{reservationId}
      reversal: unlinkReservation
      reversal_operation: DELETE /reservation-requests/{reservationRequestsId}/reservations/{reservationId}
      window: null
      note: >-
        "Unlinking does not cancel or change the reservation itself." A clean, side-effect-free undo of
        the link only.
      source: openapi/cvent-hospitality-cloud-housing-openapi.yml
    - operation: associateMeetingRoomImage
      method: PUT
      path: /venues/{venueId}/meeting-rooms/{meetingRoomId}/images
      reversal: disassociateMeetingRoomImage
      reversal_operation: DELETE /venues/{venueId}/meeting-rooms/{meetingRoomId}/images/{imageId}
      window: null
      source: openapi/cvent-hospitality-cloud-venue-meeting-rooms-openapi.yml
    - operation: createMeetingRoom
      method: POST
      path: /venues/{venueId}/meeting-rooms
      reversal: null
      window: null
      note: >-
        No delete operation for a meeting room is published. Creation of a meeting room is, on the
        public contract, not reversible.
      source: openapi/cvent-hospitality-cloud-venue-meeting-rooms-openapi.yml
    - operation: createMeetingRequest
      method: POST
      path: /meeting-request-forms/{id}/requests
      reversal: null
      window: null
      note: >-
        updateMeetingRequest (PUT) can change a submitted request, but no cancel or withdraw operation
        is published.
      source: openapi/cvent-hospitality-cloud-meeting-requests-openapi.yml
    - operation: createProposalDraft
      method: POST
      path: /proposal-drafts
      reversal: null
      window: null
      source: openapi/cvent-hospitality-cloud-proposal-drafts-openapi.yml
    - operation: updateHotelRoomRates
      method: PUT
      path: /housing-hotels/{hotelCode}/rooms/{roomCode}/rates
      reversal: null
      window: null
      note: >-
        A full replace with no versioning or restore path. Reversing a rate change means re-sending the
        previous rates, which the caller must have kept.
      source: openapi/cvent-hospitality-cloud-housing-hotels-openapi.yml
  booking_windows_note: >-
    housing-event-hotel carries reservationAccessDate and hotelCloseDate. These bound when a room block
    can be BOOKED — they are not reversal windows, and are recorded here only so a reader does not
    mistake one for the other.
