note: 'Cvent ships BOTH a 469-operation REST contract and a remote MCP server, but the MCP tool list is OAuth-gated:
  an anonymous tools/list against https://mcp.cvent.com/mcp returns HTTP 401 with an empty body, and neither the
  developer portal nor www.cvent.com/llms.txt publishes the tool names. With no tool names in hand there is nothing
  to bind, so crosswalk[] and mcp_only[] are deliberately EMPTY rather than guessed. What this file does record
  is the REST side of the eventual mapping — every hospitality operation an MCP tool could be backed by — so an
  authenticated re-run has one job: fetch tools/list and bind. Emitting a name-matched crosswalk here would assert
  bindings nobody has observed.'
