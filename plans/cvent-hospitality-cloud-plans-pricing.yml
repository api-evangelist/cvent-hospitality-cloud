generated: '2026-09-07'
method: searched
created: '2026-05-04'
modified: '2026-09-07'
supersedes: >-
  A 2026-05-04 bulk-sweep scaffold that invented three tiers (Free / Professional / Enterprise) with
  monthly request quotas and "TBD" prices. Cvent publishes none of that. Recording an honest zero is the
  correct measurement.
plan_count: 0
public_pricing: false
description: >-
  Cvent publishes no public price list, no self-serve plan page and no per-call pricing for any part of
  the Hospitality Cloud API surface. Access is sold as licensed product, and API entitlement follows the
  licence rather than a developer plan.
findings:
  - finding: No public pricing page
    detail: >-
      https://www.cvent.com/en/pricing does not exist as a plan table. The path www.cvent.com/llms.txt
      itself points at https://www.cvent.com/en/request-demo under the heading "Pricing: Know about
      Cvent pricing, get demo" — the provider's own machine-readable index routes pricing to a demo
      request.
    url: https://www.cvent.com/en/request-demo
  - finding: Passkey RegLink is a licensed add-on
    detail: >-
      "Passkey is available as an add-on license. Contact your Cvent account representative for more
      information." Access to the RegLink REST API additionally requires contacting the Passkey RegLink
      API team to have credentials issued.
    url: https://developers.cvent.com/docs/passkey/REST/overview
  - finding: API access is gated on account licences, not on a plan purchase
    detail: >-
      "Your starting point depends on which Passkey and REST API licenses your organization has." A
      Cvent account administrator then invites developers, who create applications inside a workspace
      and attach scopes.
    url: https://developers.cvent.com/docs/passkey/REST/getting-started
  - finding: Usage tiers exist but are not a published price list
    detail: >-
      The contract exposes GET /usage/tier returning a UsagePlan (name such as API_Platform_Free_Tier,
      daily quota, burst limit, per-second rate limit) and a switchBackPlan for scheduled reversion.
      Tiers are therefore real and account-assigned, but Cvent publishes neither their names, their
      limits, nor their prices. See rate-limits/cvent-hospitality-cloud-rate-limits.yml.
    url: https://developers.cvent.com/docs/rest-api/guides/handling-rate-limits
plans: []
signup:
  self_serve: false
  path: >-
    Existing Cvent customer with the right licences; account admin invites the developer; developer
    creates an application in a workspace and receives client credentials.
  developer_portal: https://developers.cvent.com/
  contact_sales: https://www.cvent.com/en/contact-us
