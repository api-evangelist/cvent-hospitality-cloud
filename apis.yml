apis:
- aid: cvent-hospitality-cloud:passkey-reglink
  name: Cvent Passkey RegLink API
  description: 'Passkey RegLink is the hotel room-block and housing surface of the Cvent platform. It connects
    an external registration system to Passkey events and hotel inventory: fetch housing events, hotels, room
    types, availability and inventory; create a reservation request (the "bridge") that pre-populates a registrant
    and hands them a unique booking link; then create, update, cancel, link and unlink the resulting reservations.
    Cvent''s own migration guide maps every legacy XML and browser RegLink call onto these operations. It is delivered
    as the Housing and Housing Hotels tags of the unified Cvent REST API at https://api-platform.cvent.com/ea,
    secured with OAuth 2.0 and 15 housing/* scopes, with an optional callback service that POSTs on reservation
    create, modify and cancel. Passkey is an add-on licence.'
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.cvent.com/docs/passkey/REST/overview
  baseURL: https://api-platform.cvent.com/ea
