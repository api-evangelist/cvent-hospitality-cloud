- aid: cvent-hospitality-cloud:rest-api
  name: Cvent Platform REST API (Hospitality)
  description: The unified Cvent REST API at https://api-platform.cvent.com/ea (and its EMEA peer https://api-platform-eur.cvent.com/ea)
    is one OpenAPI 3.0.2 document of 356 paths and 469 operations across 56 tags; 87 of those operations are the
    hospitality surface split into this repository. Authentication is OAuth 2.0 — client credentials for machine-to-machine
    applications, authorization code for web applications — with 238 named scopes, 60-minute tokens, cursor pagination
    on paging.currentToken, a {code, message, details[]} error envelope, X-RateLimit-* headers and a per-account
    usage tier readable at GET /usage/tier.
