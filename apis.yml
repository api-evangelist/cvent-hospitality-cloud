apis:
- aid: cvent-hospitality-cloud:passkey-reglink
  name: Cvent Passkey RegLink API
  description: >-
    Passkey RegLink APIs are RESTful JSON APIs (with legacy URL-based and SOAP options) that connect Cvent
    registration with Passkey hotel reservations. Primary functions include sending registrant information
    to Passkey to streamline hotel reservations, fetching Passkey event and hotel availability, retrieving
    reservation information, and creating, updating, and cancelling registrant reservations.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.cvent.com/docs/passkey/REST/overview
  baseURL: https://api-platform.cvent.com
