- aid: cvent-hospitality-cloud:cvent-hospitality-cloud-attendee-activities-api
  name: Cvent Hospitality Cloud Attendee Activities API
  description: >-
    The Attendee Activities API gives valuable insight into your customer's experience at your Cvent event.

    Now, you can get a fuller picture of your customer's journey, including onsite activities, offsite
    meetings,

    breakout sessions, booth visits, and virtual seminars. You can use that data to compile a unified
    customer

    profile that integrates with your external systems and data.


    By gathering all this info into a single interface, the API allows you to see your customer's engagement

    at every step of the journey, create engagement models, and integrate that data with your external
    tools.

    You can use this data to understand what your customers are looking for, keep them engaged, build
    loyalty,

    drive upsell, and increase the long-term value of your events.


    Please note that attendee activities data is retained for a maximum of 2 years and is purged thereafter.


    For more details on [attendee activities](https://developers.cvent.com/docs/rest-api/explanation/attendee-activities).
