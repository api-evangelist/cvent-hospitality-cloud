- aid: cvent-hospitality-cloud:soap-v200611
  name: Cvent SOAP Web Services API (V200611)
  description: Cvent's legacy SOAP 1.1 / WSDL 1.1 / WS-I Basic Profile 1.1 Web Services API, still served and
    still documented. 51 operations and 390 complex types under targetNamespace http://api.cvent.com/2006-11,
    including the hospitality calls CreateRFP, CreateMeetingRequest, UpdateMeetingRequest and the approver operations.
    Authentication is a session ticket obtained from its own Login call — not OAuth. Quota is 10,000 calls per
    organization per 24 hours (Eastern Time), introspectable via DescribeGlobal. Cvent files it under legacy-api
    and publishes a call-by-call REST migration guide, but has announced no sunset.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.cvent.com/docs/legacy-api/soap-api/framework
  baseURL: https://api.cvent.com/soap/V200611.ASMX
