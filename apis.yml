aid: cvent-hospitality-cloud
name: Cvent Hospitality Cloud
kind: company
description: Cvent Hospitality Cloud is the hotel and venue product line of the Cvent Platform. It includes the
  Cvent Supplier Network (the marketplace connecting event planners with hotels and venues for RFPs and bookings),
  Passkey (hotel room block and housing management), Venue Sourcing (venue search and discovery), and Sales &
  Catering (booking management, catering, and contracts). Programmatic access is delivered primarily through the
  Passkey RegLink REST APIs (with legacy SOAP and URL-based options) and the unified Cvent Platform REST API.
  Authentication uses OAuth 2.0 client credentials with the token endpoint at api-platform.cvent.com/ea/oauth2/token.
