note: >-
  Read from the securitySchemes block of the contract Cvent publishes at
  https://developers.cvent.com/documentation and cross-checked against the developer portal. Every
  hospitality operation is OAuth 2.0 bearer-protected: 'Authorization: Bearer {accessToken}', tokens
  valid for 60 minutes, minted at https://api-platform.cvent.com/ea/oauth2/token. Machine-to-machine
  integrations use client credentials and the call is attributed to the application; web applications use
  the authorization code flow and the call is attributed to the authenticating Cvent administrator, who
  must be both an admin and a registered developer.
  Two additional schemes in the contract, CallbackApiKeyAuth and CallbackBasicAuth, are INBOUND — they
  describe how Cvent authenticates itself to a subscriber's webhook endpoint, not how a client
  authenticates to Cvent.
  The legacy SOAP API does NOT use OAuth: it exchanges credentials for a session ticket via its own Login
  call (see wsdl/cvent-hospitality-cloud-soap-v200611.yml).
