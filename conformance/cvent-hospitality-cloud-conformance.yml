domain_standards:
  - id: scim2
    name: SCIM 2.0 (System for Cross-domain Identity Management, RFC 7643/7644)
    conforms: true
    weight: domain-standard
    evidence: >-
      The contract exposes a full SCIM 2.0 service under /scim/v2 — /scim/v2/Users, /scim/v2/Groups,
      /scim/v2/ServiceProviderConfig, /scim/v2/ResourceTypes, /scim/v2/Schemas — and declares the SCIM
      schema URNs urn:ietf:params:scim:schemas:core:2.0:User,
      urn:ietf:params:scim:schemas:extension:enterprise:2.0:User,
      urn:ietf:params:scim:api:messages:2.0:ListResponse and
      urn:ietf:params:scim:api:messages:2.0:Error, plus an ErrorScimType schema.
      Location: paths./scim/v2/* and components.schemas in
      openapi/_original/cvent-hospitality-cloud-rest-apis-openapi.json; also documented at
      https://developers.cvent.com/docs/platform/data-models/user-scim
    note: >-
      SCIM is an identity-provisioning standard, not a hospitality one. It is recorded because the
      CONTRACT declares it — an enterprise buyer who already speaks SCIM provisions Cvent users with no
      bespoke connector. The User SCIM tag carries 11 operations.
  - id: hospitality-messaging
    name: Hospitality domain standards (OTA / HTNG / GDS message types)
    conforms: false
    evidence: >-
      Searched the full 469-operation contract and the 1,309 component schemas for OpenTravel (OTA_*),
      HTNG and GDS message shapes on the Housing, Housing Hotels, RFP and Travel Suppliers surfaces.
      No OTA_/OpenTravel/HTNG message shape appears anywhere. "GDS" occurs only as opaque passthrough
      fields (externalCodes on property and room, flightGDSRecordLocator, recordLocatorGDS, noteGDS) —
      identifiers carried for someone else's system, not an implemented message standard. The hotel
      room-block, RFP and property models are entirely Cvent-proprietary (housing-event-hotel,
      room-type, reservation-request, RfpRequest, property).
    note: >-
      Recorded as an honest negative. Group-housing and venue-sourcing have no widely-adopted open
      message standard the way payments or identity do, so this is not a penalty — it is the state of
      the market.
